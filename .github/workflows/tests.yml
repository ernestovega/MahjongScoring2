name: Tests

on:
  pull_request:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  unit-tests:
    # Linux on purpose: the golden screenshots were recorded on Linux and font rendering differs on macOS/Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Runs every JVM test (unit, golden files, Room, ViewModels, UI flows) and compares every screenshot.
      - name: All tests + golden screenshots
        run: bash ./gradlew :app:verifyRoborazziDebug
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
            app/src/test/screenshots/*_compare.png
            app/src/test/screenshots/*_actual.png
